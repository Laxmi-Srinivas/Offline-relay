name: Publish onya website

# A push of reviewed website changes to the integration branch publishes the site.
# Repository Pages/environment setup is required; no main merge is needed.
on:
  workflow_dispatch:
  push:
    branches: [integration/final-hackathon]
    paths:
      - website/onya/**
      - .github/workflows/onya-pages.yml

permissions:
  contents: read

concurrency:
  group: onya-github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/integration/final-hackathon'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out website source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: website/onya
      - name: Check static presentation
        run: python3 website/onya/tests/static_check.py
      - name: Build only the public website output
        run: |
          python3 website/onya/package_site.py --output "$RUNNER_TEMP/onya.zip"
          mkdir -p "$RUNNER_TEMP/onya-site"
          python3 -m zipfile -e "$RUNNER_TEMP/onya.zip" "$RUNNER_TEMP/onya-site"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the website build output
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/onya-site

  deploy:
    if: github.ref == 'refs/heads/integration/final-hackathon'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approved presentation
        id: deployment
        uses: actions/deploy-pages@v4
